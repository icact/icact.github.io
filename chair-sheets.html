<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Session Chair Sheets — ICACT 2026</title>
<meta name="description" content="Attendance and evaluation sheets for ICACT 2026 session chairs. Restricted access.">
<meta name="theme-color" content="#00629B">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/ieee-favicon.svg" type="image/svg+xml">
<style>
:root{
  --paper:#ffffff; --ink:#141414; --ink-2:#3c3c3c; --ink-3:#6a6a6a;
  --line:#9aa8b2; --line-2:#c4ccd2; --shade:#eef1f4;
  --blue:#00629b; --blue-d:#004b77; --ground:#e6e4df; --bad:#a3251c;
  --serif:'Bookman Old Style','URW Bookman L',Bookman,Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#20252a; --ink:#eceff1; --ink-2:#c6ccd1; --ink-3:#9aa4ab;
    --line:#4a555e; --line-2:#39424a; --shade:#262c32;
    --blue:#7fb9de; --blue-d:#a4cfec; --ground:#171a1c; --bad:#e59b93;
  }
}
:root[data-theme="dark"]{
  --paper:#20252a; --ink:#eceff1; --ink-2:#c6ccd1; --ink-3:#9aa4ab;
  --line:#4a555e; --line-2:#39424a; --shade:#262c32;
  --blue:#7fb9de; --blue-d:#a4cfec; --ground:#171a1c; --bad:#e59b93;
}
*{box-sizing:border-box;}
body{margin:0; background:var(--ground); color:var(--ink); font-family:var(--serif); font-size:15px; line-height:1.5;}
#gate{max-width:560px; margin:0 auto; min-height:100vh; display:flex; align-items:center; padding:28px 20px;}
.card{background:var(--paper); border-top:6px solid var(--blue); border:1px solid var(--line-2); border-top:6px solid var(--blue); padding:32px 34px 30px; width:100%;}
.card .mark{display:block; width:132px; margin-bottom:20px;}
.card .mark svg{width:100%; height:auto; display:block;}
.card .k{margin:0 0 6px; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3);}
.card h1{margin:0 0 10px; font-size:22px; font-weight:700; line-height:1.3;}
.card p{margin:0 0 18px; font-size:14px; color:var(--ink-2);}
label{display:block; font-size:13.5px; font-weight:700; margin-bottom:6px;}
#pw{width:100%; font-family:var(--serif); font-size:16px; padding:10px 12px; border:1px solid var(--line); background:var(--shade); color:var(--ink);}
#pw:focus{outline:2px solid var(--blue); outline-offset:1px;}
button{margin-top:14px; font-family:var(--serif); font-size:15px; font-weight:700; padding:10px 22px; border:0; background:var(--blue); color:#fff; cursor:pointer;}
button:hover{background:var(--blue-d);}
button:focus-visible{outline:2px solid var(--ink); outline-offset:2px;}
button[disabled]{opacity:.6; cursor:default;}
#msg{margin:12px 0 0; font-size:13.5px; min-height:1.3em;}
#msg.bad{color:var(--bad);}
.foot{margin:22px 0 0; padding-top:14px; border-top:1px solid var(--line-2); font-size:12.5px; color:var(--ink-3);}
.foot a{color:var(--blue);}
#content{display:none;}
#content.on{display:block;}
</style>
</head>

function b64(s){
  var raw = atob(s), a = new Uint8Array(raw.length);
  for (var i = 0; i < raw.length; i++) a[i] = raw.charCodeAt(i);
  return a;
}

async function unlock(phrase){
  var enc = new TextEncoder();
  var base = await crypto.subtle.importKey("raw", enc.encode(phrase), "PBKDF2", false, ["deriveKey"]);
  var key = await crypto.subtle.deriveKey(
    { name:"PBKDF2", salt:b64(PAYLOAD.s), iterations:PAYLOAD.n, hash:"SHA-256" },
    base, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
  var out = await crypto.subtle.decrypt({ name:"AES-GCM", iv:b64(PAYLOAD.i) }, key, b64(PAYLOAD.d));
  return new TextDecoder().decode(out);
}

document.getElementById("f").addEventListener("submit", async function(e){
  e.preventDefault();
  var msg = document.getElementById("msg"), go = document.getElementById("go");
  var phrase = document.getElementById("pw").value;
  if (!phrase) return;
  if (!window.crypto || !crypto.subtle){
    msg.className = "bad";
    msg.textContent = "This browser cannot decrypt the sheets. Please open the page over https, in a current browser.";
    return;
  }
  go.disabled = true;
  msg.className = "";
  msg.textContent = "Opening\u2026";
  try {
    var html = await unlock(phrase);
    document.getElementById("gate").remove();
    var box = document.getElementById("content");
    box.innerHTML = html;
    box.className = "on";
    document.title = "Session Chair Sheets \u2014 ICACT 2026";
  } catch (err) {
    go.disabled = false;
    msg.className = "bad";
    msg.textContent = "That access phrase is not correct. Please check it and try again.";
    document.getElementById("pw").select();
  }
});
</script>

<div id="watermark" aria-hidden="true"></div>
<script>
(function(){
  "use strict";
  var stop = function(e){ e.preventDefault(); e.stopPropagation(); return false; };
  document.addEventListener("contextmenu", stop, true);
  document.addEventListener("copy", stop, true);
  document.addEventListener("cut", stop, true);
  document.addEventListener("dragstart", stop, true);
  document.addEventListener("selectstart", function(e){
    if (e.target && e.target.tagName === "INPUT") return true;
    return stop(e);
  }, true);
  document.addEventListener("keydown", function(e){
    var k = (e.key || "").toLowerCase();
    if (e.target && e.target.tagName === "INPUT" && !e.ctrlKey && !e.metaKey) return;
    if (k === "f12") return stop(e);
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && (k==="i"||k==="j"||k==="c")) return stop(e);
    /* Ctrl+P is deliberately allowed: chairs must be able to print. */
    if ((e.ctrlKey || e.metaKey) && (k==="c"||k==="x"||k==="a"||k==="s"||k==="u")) return stop(e);
  }, true);
})();
</script>
